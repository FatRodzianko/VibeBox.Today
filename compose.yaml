services:
  vibebox:
    build: .
    restart: unless-stopped
    environment:
      PORT: "${APP_PORT:-3000}"
      DATA_DIR: "/app/data"
      APP_PASSWORD: "${APP_PASSWORD}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY}"
    ports:
      - "${HOST_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - vibebox-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vibebox-data:
